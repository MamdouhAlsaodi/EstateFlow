name: EstateFlow CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.1
      - name: Enable Corepack
        run: corepack enable
      - name: Install pnpm
        run: corepack prepare pnpm@10.33.2 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run lint
        run: pnpm lint
      - name: Run typecheck
        run: pnpm typecheck
      - name: Run unit tests
        run: pnpm test
      - name: Generate OpenAPI
        run: pnpm generate:openapi
      - name: Check OpenAPI drift
        run: pnpm check:openapi-drift
      - name: Run build
        run: pnpm build
      - name: Check formatting
        run: pnpm format:check
      - name: Create ephemeral test password
        run: |
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          printf 'POSTGRES_TEST_PASSWORD=%s\n' "$password" >> "$GITHUB_ENV"
      - name: Start test infrastructure
        run: docker compose -f infra/compose/docker-compose.test.yml up -d --wait
      - name: Run integration tests
        run: >-
          DATABASE_URL="$(node -e "const databaseUrl = new URL('postgresql://');
          databaseUrl.hostname = '127.0.0.1'; databaseUrl.port = '55433';
          databaseUrl.pathname = 'estateflow_test'; databaseUrl.username = 'estateflow_test';
          databaseUrl.password = process.env.POSTGRES_TEST_PASSWORD;
          process.stdout.write(databaseUrl.toString())")"
          ALLOW_DESTRUCTIVE_TESTS=1 pnpm test:integration
      - name: Remove test infrastructure
        if: always()
        run: pnpm infra:test:down
